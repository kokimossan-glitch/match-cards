<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Cards</title>
<meta name="description" content="欧州サッカーの試合をカードで集めるウォレット">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Match Cards">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0;padding:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=El+Messiri:wght@400&family=Emblema+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 日付ごとに「ウォレット」。試合カードを縦に重ね、上端の帯だけ見せる。タップしたカードが引き出される */
:root{
  --title:#000000;
  --gold:#D4A500;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#16202B; --muted:#5D6874; --line:#D3D9E0; --soft:#F5F6F8;
  --accent:#1E4ED6; --accent-ink:#FFFFFF;
  --pl:#5B2A86; --pd:#C2410C; --sa:#1D5FA8; --bl1:#B91C1C; --fl1:#0F7A6E; --cl:#22336B;
  --t-easy:#A67A00; --t-mid:#1F6FB5; --t-hard:#1B7F52;
  --shadow:0 10px 24px rgba(20,32,48,.16), 0 2px 6px rgba(20,32,48,.10);
  --f-title:"El Messiri","Times New Roman",serif;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --peek:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --title:#F2F4F7;
  --bg:#000000; --surface:#17202A; --ink:#E4EAF0; --muted:#8F9CA8; --line:#2A3541; --soft:#1C2631;
  --accent:#86A2FF; --accent-ink:#0E141A;
  --pl:#B48BE0; --pd:#F5975F; --sa:#7DB2F0; --bl1:#F07C7C; --fl1:#5CC9BB; --cl:#9AAEF0;
  --t-easy:#F0C840; --t-mid:#6CB2F2; --t-hard:#5ACB92;
  --shadow:0 10px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --title:#F2F4F7;
  --bg:#000000; --surface:#17202A; --ink:#E4EAF0; --muted:#8F9CA8; --line:#2A3541; --soft:#1C2631;
  --accent:#86A2FF; --accent-ink:#0E141A;
  --pl:#B48BE0; --pd:#F5975F; --sa:#7DB2F0; --bl1:#F07C7C; --fl1:#5CC9BB; --cl:#9AAEF0;
  --t-easy:#F0C840; --t-mid:#6CB2F2; --t-hard:#5ACB92;
  --shadow:0 10px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* アプリ名（Figma「見出し」ページ）：El Messiri 40px・行の高さ詰め */
/* ロゴ（Figma「観戦予定（390×844）」）：2枚重ねのカードにICチップと「Match / Cards」 */
/* iPhoneのカメラ（ノッチ・Dynamic Island）を想定：画面上端からロゴまで約71pxあける。
   アプリ側で上の余白（safe-area）が取られている端末では、その分を差し引いて二重にならないようにする */
:root{--notch:59px}
header.top{display:flex;justify-content:center;
  padding-top:max(4px, calc(var(--notch) + 12px - 16px - env(safe-area-inset-top,0px)));
  padding-bottom:28px}
header.top h1{margin:0}
.logo{position:relative;display:block;width:125px;height:80px}
.logo .lc{position:absolute;width:109.4px;height:68.6px;border-radius:14.7px;background:#FFFFFF;border:2.45px solid #000000;box-shadow:0 3.3px 3.3px rgba(0,0,0,.25)}
.logo .lc.back{left:15.4px;top:0}
.logo .lc.front{left:0;top:10.5px}
.logo .lchip{position:absolute;left:11.7px;top:27.2px;width:14.9px;height:14.9px;border-radius:3.7px;
  background:linear-gradient(135deg,#E1D096 0%,#E8BD46 36%,#F5DA86 56%,#DCAF34 72%,#A97B08 100%)}
.logo .w{position:absolute;font-family:"Emblema One","Dela Gothic One",sans-serif;font-weight:400;font-size:19.8px;line-height:18.3px;color:#000000;white-space:nowrap}
.logo .w1{left:30.3px;top:29.7px}
.logo .w2{left:36.5px;top:45.1px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:12px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lg,var(--ink));border-color:var(--lg,var(--ink));color:var(--bg)}

h2.day{margin:26px 0 12px;font-size:1rem;display:flex;align-items:baseline;gap:10px}
h2.day .rel{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:1px 8px;border-radius:4px}
h2.day .cnt{margin-left:auto;font-size:.75rem;font-weight:500;color:var(--muted)}
/* 日付は、その日で一番早い試合のカード（重なりの一番手前＝下端）の下に置く */
.stack + h2.day{margin:14px 0 30px}
.stack:first-child{margin-top:22px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:.88rem}

/* ---- ウォレット：カードを重ねる ---- */
.stack{display:flex;flex-direction:column}
.mcard{
  --A:#333; --B:#666; --tA:#fff; --tB:#fff;
  position:relative;width:100%;aspect-ratio:1.586/1;max-width:100%;border-radius:18px;border:0;padding:0;text-align:left;cursor:pointer;
  /* 2チームの色の境目をグラデーションでなめらかにつなぐ（両端の約3割は各チームの色のまま） */
  background:
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.18), transparent 55%),
    linear-gradient(118deg, var(--A) 0 28%, var(--B) 72% 100%);
  background:
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.18), transparent 55%),
    linear-gradient(118deg in oklab, var(--A) 0 28%, var(--B) 72% 100%);
  box-shadow:var(--shadow);overflow:hidden;color:var(--tA);
  margin-top:calc(var(--peek) - (100% / 1.586));
}
.stack .mcard:first-child{margin-top:0}
/* 早い試合ほど手前（下）。遅い試合は後ろで上端の帯だけ見せる。引き出したカードの次のカードを下げて全体を見せる */
.mcard.open + .mcard{margin-top:14px}
/* 横スワイプ：右でマイウォレットに追加、左で解除。縦スクロールはそのまま */
.mcard{touch-action:pan-y}
.mcard.dragging{transition:none!important}
.mcard .swipe-hint{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0;font-weight:700;font-size:.95rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);border-radius:inherit}
.mcard .swipe-hint.add{background:linear-gradient(90deg, rgba(212,165,0,.55), transparent 70%)}
.mcard .swipe-hint.del{background:linear-gradient(270deg, rgba(20,26,34,.6), transparent 70%)}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--dock-h,0px) + 22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:700;font-size:.82rem;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.toast.gold{background:var(--gold);color:#1A1406}
/* マイウォレット：金色の枠 */
/* 1. 金箔のような枠（5px・グラデーションと光の筋） */
.mcard.picked::after{box-shadow:none;z-index:2;padding:5px;
  background:
    linear-gradient(115deg, transparent 38%, rgba(255,255,255,.85) 47%, transparent 56%),
    linear-gradient(135deg,#FFF1B8 0%,#E6B93C 22%,#A87A06 42%,#FFE07A 54%,#C99418 74%,#FFEFA8 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)}
/* 2. カードの外側ににじむ金色の光 */
.mcard.picked{box-shadow:var(--shadow), 0 0 0 1px rgba(212,165,0,.8), 0 0 18px 4px rgba(245,196,40,.6)}
/* 3. 登録した瞬間に一度だけ光が走る */
.mcard .shine{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;overflow:hidden}
.mcard .shine::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,236,150,.15) 20%, rgba(255,248,210,.85) 50%, rgba(255,236,150,.15) 80%, transparent)}
@media (prefers-reduced-motion:no-preference){
  .mcard .shine::before{animation:shine .9s cubic-bezier(.3,.6,.3,1) forwards}
  .mcard.just-picked{animation:pickpop .5s ease-out}
}
@media (prefers-reduced-motion:reduce){ .mcard .shine{display:none} }
@keyframes shine{to{left:120%}}
@keyframes pickpop{0%{box-shadow:var(--shadow), 0 0 0 1px rgba(212,165,0,.75), 0 0 0 0 rgba(245,196,40,0)}40%{box-shadow:var(--shadow), 0 0 0 1px rgba(212,165,0,.9), 0 0 30px 8px rgba(255,210,60,.8)}100%{box-shadow:var(--shadow), 0 0 0 1px rgba(212,165,0,.75), 0 0 16px 3px rgba(245,196,40,.55)}}
.mcard.open{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.mcard{transition:margin-top .32s cubic-bezier(.2,.8,.2,1), transform .32s cubic-bezier(.2,.8,.2,1)}}
/* 光沢と細いギョーシェ模様 */
.mcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background:repeating-radial-gradient(circle at 110% 120%, transparent 0 9px, rgba(255,255,255,.9) 9px 10px)}
.mcard::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}

/* カードデザイン1：上段＝HOMEとAWAY（重ねたときも見える）、左＝ICチップ、中央＝得点、下＝視聴リンクのタブ */
.band{position:absolute;inset:0 0 auto 0;height:var(--peek);z-index:1}
.lgtag{font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;white-space:nowrap}
/* リーグ表示：ICチップ */
.mcard .ic{position:absolute;z-index:1;left:30px;top:70px;width:54px;height:46px;border-radius:10px;overflow:hidden;
  /* 各リーグのテーマカラーを金属風に：明るい縁 → 地の色 → 光の筋 → 影 */
  --l:#F6E3A1; --b:#D4AE55; --h:#F0D88D; --d:#B8892E; color:rgba(92,62,8,.55);
  background:
    linear-gradient(115deg, transparent 42%, rgba(255,255,255,.38) 50%, transparent 58%),
    linear-gradient(135deg,var(--l) 0%,var(--b) 36%,var(--h) 56%,var(--b) 72%,var(--d) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.3)}
.mcard [data-lg="PL"], .lgbtn[data-lg="PL"]{--l:#DCCBF2; --b:#7442A8; --h:#C9B0EC; --d:#3E1A63; color:rgba(255,255,255,.32)}
.mcard [data-lg="PD"], .lgbtn[data-lg="PD"]{--l:#FFC6A8; --b:#E8461E; --h:#FFB18C; --d:#8A2408; color:rgba(255,255,255,.34)}
.mcard [data-lg="SA"], .lgbtn[data-lg="SA"]{--l:#BDE3FA; --b:#1C72BC; --h:#A9D8F5; --d:#0A3563; color:rgba(255,255,255,.34)}
.mcard [data-lg="BL1"], .lgbtn[data-lg="BL1"]{--l:#FFB9BE; --b:#E8081E; --h:#FF9AA2; --d:#7A0510; color:rgba(255,255,255,.32)}
.mcard [data-lg="FL1"], .lgbtn[data-lg="FL1"]{--l:#B4C1E0; --b:#1E2F66; --h:#8EA1D2; --d:#0A1230; color:rgba(255,255,255,.3)}
.mcard [data-lg="CL"], .lgbtn[data-lg="CL"]{--l:#FFFFFF; --b:#A8B0BE; --h:#F4F6FA; --d:#5B6374; color:rgba(30,40,60,.42)}
.mcard .ic .ic-pads{position:absolute;inset:0;width:100%;height:100%}
.mcard .ic .lgi{position:absolute;left:50%;top:50%;width:24.6px;height:34px;transform:translate(-50%,-50%);object-fit:contain;
  background:#FFFFFF;padding:3px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
/* リーグのマーク：VISAのロゴの位置（右下） */
.mcard .brand{position:absolute;z-index:3;right:22px;bottom:20px;display:flex;align-items:center;gap:7px}
.mcard .brand .bname{font-family:var(--f-body);font-weight:700;font-size:10.5px;line-height:1.15;letter-spacing:.05em;text-align:right;color:#FFFFFF;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.mcard .brand .bbox{width:37px;height:40px;flex:0 0 37px;border-radius:9px;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mcard .brand .lgi{width:28px;height:30px;object-fit:contain;background:none;padding:0;border-radius:0}
.mcard .lgname{position:absolute;z-index:1;left:51.8px;top:108px;transform:translateX(-50%);font-size:.66rem;font-weight:700;letter-spacing:.06em;white-space:nowrap;
  padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.28);color:#fff}
.band .kt{position:absolute;left:50%;top:17px;transform:translateX(-50%);white-space:nowrap}
.band .tm{position:absolute;top:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.band .tm .crest{width:32px;height:32px}
.band .tm small{font-size:8px;font-weight:500;letter-spacing:.06em;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.band .th{left:17px} .band .ta{right:17px}
.band .nm{position:absolute;top:19px;max-width:calc(50% - 104px);font-weight:700;font-size:11px;line-height:1.5;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.band .nh{left:57px} .band .na{right:57px;text-align:right}
.mcard .md{position:absolute;z-index:1;left:24px;bottom:16px;font-size:12px;font-weight:500;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.mcard .bstrip{position:absolute;z-index:1;left:0;right:0;bottom:0;height:12px;background:#15202A}
/* 時刻のラベル＝リーグ色のミニチップ：重ねたときもリーグが分かる */
.band .kt{font-family:var(--f-mono);font-weight:600;font-size:14.7px;font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border-radius:6px;
  /* マット：リーグの地の色に、ごく弱い上下の明暗だけ。光の筋やハイライトは入れない */
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.08)), var(--b);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16), 0 1px 2px rgba(0,0,0,.22);
  color:#FFFFFF !important;text-shadow:none}
.band .kt[data-lg="CL"]{color:#1A2232 !important}
.band .kt .lgi{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:#FFFFFF;padding:2px;object-fit:contain;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

/* カード本体 */
.body{position:absolute;inset:var(--peek) 0 0 0;padding:0 16px 14px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.side{position:absolute;top:37%;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:1.02rem;line-height:1.35;max-width:calc(50% - 68px);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.side .nm{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{overflow:hidden}
.side.a{align-items:flex-end}
.side small{font-size:.62rem;font-weight:500;letter-spacing:.08em;opacity:.8;text-transform:uppercase}
.side.h{left:16px;color:var(--tA)} .side.a{right:16px;text-align:right;color:var(--tB)}
.side .lab{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.side.a .lab{flex-direction:row-reverse}
.mono{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.7rem;font-weight:700;border:1.5px solid currentColor}
/* 時刻：マイルの数字のような分割フラップ */
.flap{position:absolute;z-index:1;left:50%;top:51.8%;transform:translate(-50%,-50%);display:flex;gap:4px;align-items:center}
.flap b{display:grid;place-items:center;width:clamp(30px,9vw,36px);height:clamp(42px,12.5vw,48px);border-radius:6px;font-family:var(--f-mono);font-weight:600;font-size:clamp(1.4rem,6.4vw,1.9rem);color:#fff;
  background:linear-gradient(rgba(255,255,255,.16) 0 49%, rgba(0,0,0,.12) 51% 100%), rgba(10,14,20,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);position:relative}
.flap b{isolation:isolate}
.flap b::after{z-index:-1;content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.flap i{font-style:normal;font-family:var(--f-mono);font-weight:600;color:#fff;font-size:1.3rem;opacity:.85;width:12px;text-align:center}
.flap{gap:6px}
.foot{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;font-size:.7rem;color:#fff}
/* 視聴サービスのリンク：カード中央の下部 */
.mcard .svc{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:31px;
  font-family:var(--f-display);font-size:14px;line-height:1;letter-spacing:.02em;color:#EDF0F3;background:#15202A;text-decoration:none;
  padding:0 9px 3px;border-radius:8px 8px 0 0;font-size:14.7px}
.mcard .svc:hover{background:#000}
.mcard .svc:focus-visible{outline:2px solid #fff;outline-offset:2px}
.foot .md{opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.watch{display:inline-flex;align-items:center;gap:5px;background:rgba(10,14,20,.42);border-radius:999px;padding:3px 10px 3px 8px;font-weight:700}
.watch svg{width:11px;height:11px;fill:currentColor}
.watch .zz{font-family:var(--f-mono);font-style:italic;letter-spacing:-.04em}
.watch.easy{color:#FFE27A} .watch.mid{color:#A9D3FF} .watch.hard{color:#9BEBC2}
.hint{font-size:.74rem;color:var(--muted);margin-top:14px}
/* 過去の試合：スコア表示。少し彩度を落として「使用済み」のカードに見せる */
.mcard.done{filter:saturate(.72)}
.watch.fin{color:#fff}
h2.day.past{color:var(--muted)}
h2.day .rel.past{background:var(--muted);color:var(--bg)}
.edge{margin:22px 0 0;text-align:center;font-size:.74rem;color:var(--muted)}

  function renderTabbar(){

  // ---- カード ----
  function card(m){
    const [A,B]=pair(m), j=jst(m.ts), hh=pad(j.h), mm=pad(j.mi), done=isDone(m), stale=isStale(m), picked=S.picks.has(m.id);
    const b=document.createElement("div");
    b.className="mcard"+(S.openId===m.id?" open":"")+(done||stale?" done":"")+(picked?" picked":"");
    b.tabIndex=0; b.setAttribute("role","button"); b.dataset.id=m.id;
    b.style.setProperty("--A",A); b.style.setProperty("--B",B);
    b.style.setProperty("--tA",onText(A)); b.style.setProperty("--tB",onText(B));
    b.setAttribute("aria-expanded", String(S.openId===m.id));
    b.setAttribute("aria-label", stale ? `${COMP[m.c]} ${m.h.n} 対 ${m.a.n} ${hh}時${mm}分開始・試合終了（結果未取得）` : (done ? `${COMP[m.c]} ${m.h.n} ${m.sc[0]} 対 ${m.sc[1]} ${m.a.n} 試合終了` : `${COMP[m.c]} ${m.h.n} 対 ${m.a.n} ${hh}時${mm}分開始`) + (picked?"・マイウォレット":""));
    const round = m.c==="CL" ? `リーグフェーズ 第${m.md}節` : `第${m.md}節`;
    // 中央は得点で統一。試合前は「-」
    const s1 = done ? m.sc[0] : stale ? "?" : "-", s2 = done ? m.sc[1] : stale ? "?" : "-";
    b.innerHTML = `
      <div class="band">
        <span class="tm th">${crest(m.h.id,m.h.n)}<small>HOME</small></span>
        <span class="nm nh">${esc(m.h.n)}</span>
        <span class="kt" data-lg="${m.c}">${lgi(m.c)}${hh}:${mm}</span>
        <span class="nm na">${esc(m.a.n)}</span>
        <span class="tm ta">${crest(m.a.id,m.a.n)}<small>AWAY</small></span></div>
      <span class="ic" data-lg="${m.c}" aria-hidden="true">${CARDIC}</span>
      <span class="brand" aria-hidden="true"><span class="bname">${LGEN[m.c]||""}</span></span>
      <div class="flap" aria-hidden="true"><b>${s1}</b><i>${done?"−":":"}</i><b>${s2}</b></div>
      <span class="md">${round}</span>
      <span class="bstrip" aria-hidden="true"></span>
      ${SVC[m.c] ? `<a class="svc" href="${SVC[m.c].url}" target="_blank" rel="noopener" aria-label="${SVC[m.c].name}で見る（新しいタブ）">${SVC[m.c].name}</a>` : ""}`;
    const sv=b.querySelector(".svc"); if(sv){ sv.addEventListener("click",e=>e.stopPropagation()); sv.addEventListener("pointerdown",e=>e.stopPropagation()); }
    const toggle=()=>{ S.openId = S.openId===m.id ? null : m.id;
      // 開けるのは1枚だけ。前に引き出していたカードは収納する
      document.querySelectorAll(".mcard").forEach(x=>{ const on=Number(x.dataset.id)===S.openId; x.classList.toggle("open",on); x.setAttribute("aria-expanded",String(on)); }); };
    let moved=false;
    b.onclick=()=>{ if(moved){ moved=false; return; } toggle(); };
    const carousel = S.dateMode==="carousel";
    b.onkeydown=e=>{
      if((e.key==="Enter"||e.key===" ") && e.target===b){ e.preventDefault(); toggle(); }
      else if(carousel && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ e.preventDefault(); const car=b.closest(".carousel"); if(car) goPage(car, curPage(car)+(e.key==="ArrowRight"?1:-1), true); }
      else if(carousel && (e.key==="f"||e.key==="F")){ e.preventDefault(); setPick(m, !S.picks.has(m.id)); }
      else if(!carousel && e.key==="ArrowRight"){ e.preventDefault(); setPick(m, true); }
      else if(!carousel && e.key==="ArrowLeft"){ e.preventDefault(); setPick(m, false); } };
    if(carousel){
      // ---- 長押し（カルーセル方式）：0.2秒後から震え始め、だんだん大きく。0.9秒で縁が金色に光って登録／解除 ----
      b.addEventListener("contextmenu",e=>e.preventDefault());
      const START=200, DONE=900, reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
      let pid=null, sx=0, sy=0, t0=0, raf=0, fired=false;
      const reset=()=>{ cancelAnimationFrame(raf); raf=0; b.classList.remove("pressing"); b.style.transform=""; b.style.removeProperty("--p"); };
      const tick=now=>{
        const el=now-t0, p=Math.max(0,Math.min(1,(el-START)/(DONE-START)));
        if(el>=START) b.classList.add("pressing");
        b.style.setProperty("--p", p.toFixed(3));
        if(!reduce && el>=START){ const a=0.4+2.6*p, k=el/1000;
          b.style.transform=`translate(${(a*Math.sin(k*70)).toFixed(2)}px, ${(a*.35*Math.cos(k*83)).toFixed(2)}px) rotate(${(a*.32*Math.sin(k*61)).toFixed(2)}deg)`; }
        if(el>=DONE){ fired=true; moved=true; pid=null; reset(); try{ navigator.vibrate&&navigator.vibrate(18); }catch(_){}
          setPick(m, !S.picks.has(m.id)); setTimeout(()=>{ moved=false; },400); return; }
        raf=requestAnimationFrame(tick); };
      b.addEventListener("pointerdown",e=>{ if(e.button!==0||e.target.closest(".svc")) return; pid=e.pointerId; sx=e.clientX; sy=e.clientY; t0=performance.now(); fired=false; raf=requestAnimationFrame(tick); });
      b.addEventListener("pointermove",e=>{ if(e.pointerId!==pid) return; if(Math.hypot(e.clientX-sx,e.clientY-sy)>8){ pid=null; reset(); } });
      const stop=e=>{ if(e.pointerId!==pid) return; pid=null; if(!fired) reset(); };
      b.addEventListener("pointerup",stop); b.addEventListener("pointercancel",stop);
      return b;
    }
    // ---- 横スワイプ（縦スクロール方式） ----
    const hint=document.createElement("div"); hint.className="swipe-hint"; hint.setAttribute("aria-hidden","true"); b.appendChild(hint);
    const TH=70; let sx=0, sy=0, dx=0, id=null, horiz=null;
    b.addEventListener("pointerdown",e=>{ if(e.button!==0) return; id=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; horiz=null; });
    b.addEventListener("pointermove",e=>{
      if(e.pointerId!==id) return;
      const x=e.clientX-sx, y=e.clientY-sy;
      if(horiz===null){ if(Math.abs(x)<8 && Math.abs(y)<8) return; horiz = Math.abs(x)>Math.abs(y)*1.2; if(horiz){ b.setPointerCapture(id); b.classList.add("dragging"); } else { id=null; return; } }
      dx=x; const lim=Math.max(-140,Math.min(140,dx));
      b.style.transform=`translateX(${lim}px) rotate(${lim/60}deg)`;
      const add=dx>0; hint.className="swipe-hint "+(add?"add":"del");
      hint.textContent = add ? (S.picks.has(m.id)?"マイウォレットに登録済み":"マイウォレットに追加") : (S.picks.has(m.id)?"マイウォレットから外す":"マイウォレットに入っていません");
      hint.style.opacity=String(Math.min(1,Math.abs(dx)/TH));
    });
    const end=e=>{ if(e.pointerId!==id) return; id=null;
      if(horiz){ moved=true; b.classList.remove("dragging"); b.style.transform=""; hint.style.opacity="0";
        if(dx>=TH) setPick(m,true); else if(dx<=-TH) setPick(m,false);
        setTimeout(()=>{ moved=false; },350); } horiz=null; };
    b.addEventListener("pointerup",end); b.addEventListener("pointercancel",end);
    return b;
  }
  let toastTimer=null;
  function toast(msg, gold){
    let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
    el.className="toast"+(gold?" gold":""); el.textContent=msg; el.hidden=false;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.hidden=true; },1600);
  }
  // マイウォレットの登録・解除。カードは金色の枠で示す
  function setPick(m, on){
    const had=S.picks.has(m.id);
    if(on===had){ toast(on?"すでにマイウォレットに入っています":"マイウォレットに入っていません"); return; }
    if(on) S.picks.add(m.id); else S.picks.delete(m.id);
    store.set("picks",[...S.picks]);
    document.querySelectorAll(`.mcard[data-id="${m.id}"]`).forEach(c=>{
      c.classList.toggle("picked",on);
      if(on){ // 登録した瞬間だけ光を走らせる
        c.querySelectorAll(".shine").forEach(x=>x.remove());
        const sh=document.createElement("div"); sh.className="shine"; sh.setAttribute("aria-hidden","true"); c.appendChild(sh);
        c.classList.remove("just-picked"); void c.offsetWidth; c.classList.add("just-picked");
        setTimeout(()=>{ sh.remove(); c.classList.remove("just-picked"); }, 1000);
      } });
    toast(on?`マイウォレットに追加：${m.h.n} vs ${m.a.n}`:`マイウォレットから外しました`, on);
    renderTabbar();
    if(S.tab==="plan") renderPlan();
  }


  // 日付ごとのウォレット。縦スクロール方式：上が未来・下が過去。カルーセル方式：左が過去・右が未来（1日＝1ページ）
  // 1日の中は上から遅い試合→早い試合、早いほど手前
  function dayHead(k,n){
    const d=new Date(k+"T00:00:00Z"), r=rel(k), past=k<today();
    const h=document.createElement("h2"); h.className="day"+(past?" past":""); h.dataset.key=k;
    h.innerHTML=`${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）${r?`<span class="rel${past?" past":""}">${r}</span>`:""}<span class="cnt">${n}試合</span>`;
    return h;
  }
  function stackOf(ms){
    const s=document.createElement("div"); s.className="stack";
    ms.slice().reverse().forEach((m,i)=>{ const c=card(m); c.style.zIndex=String(i+1); s.appendChild(c); });
    return s;
  }
  function nextKey(list){ const n=list.filter(m=>!isPast(m)).sort((a,b)=>a.ts<b.ts?-1:1)[0]; return n? jst(n.ts).key : today(); }
  function curPage(car){ const p=car.children; if(!p.length) return 0; const w=p[0].offsetWidth+16; return Math.max(0,Math.min(p.length-1,Math.round(car.scrollLeft/w))); }
  function goPage(car,i,smooth){ const p=car.children; if(!p.length) return; i=Math.max(0,Math.min(p.length-1,i)); const w=p[0].offsetWidth+16;
    car.scrollTo({left:i*w, behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth":"auto"}); }
  function wallet(list){
    const by={}; for(const m of list){ const k=jst(m.ts).key; (by[k]=by[k]||[]).push(m); }
    const keys=Object.keys(by).sort();
    if(S.dateMode!=="carousel"){
      const frag=document.createDocumentFragment();
      for(const k of keys.slice().reverse()) frag.append(stackOf(by[k]), dayHead(k,by[k].length));
      return frag;
    }
    const wrap=document.createElement("div"); wrap.className="cwrap";
    const car=document.createElement("div"); car.className="carousel";
    const dots=document.createElement("div"); dots.className="cdots"; dots.setAttribute("aria-label","日付");
    keys.forEach((k,i)=>{
      const pg=document.createElement("section"); pg.className="cpage"; pg.dataset.key=k;
      pg.append(stackOf(by[k]), dayHead(k,by[k].length)); car.appendChild(pg);
      const d=document.createElement("button"); d.type="button"; d.className="cdot"+(k===today()?" today":"");
      const dd=new Date(k+"T00:00:00Z"); d.setAttribute("aria-label",`${dd.getUTCMonth()+1}月${dd.getUTCDate()}日`);
      d.onclick=()=>goPage(car,i,true); dots.appendChild(d);
    });
    let last=-1, settle=0;
    const sync=()=>{ const i=curPage(car); if(i!==last){ last=i; [...dots.children].forEach((d,j)=>{ d.classList.toggle("on",j===i); d.setAttribute("aria-current",j===i?"true":"false"); }); }
      onScroll(); };
    car.addEventListener("scroll",()=>{ sync(); clearTimeout(settle); settle=setTimeout(()=>{
      // ページが変わったら、その日で一番早い試合のカードと日付が見える位置に縦位置を合わせる
      const pg=car.children[curPage(car)]; alignBase(pg && pg.querySelector(":scope > h2.day"), true); },140); },{passive:true});
    wrap.append(car,dots);
    // はじめは「次の試合がある日」を表示
    requestAnimationFrame(()=>{ const nk=nextKey(list); let i=keys.findIndex(k=>k>=nk); if(i<0) i=keys.length-1; goPage(car,i,false); sync(); });
    return wrap;
  }
  function filtered(list){
    return list.filter(m=>S.showPast||!isPast(m));
  }

  // ---- マイウォレット ----

  // ---- 試合検索 ----
  function renderSearch(keepFocus){
    const v=document.getElementById("v-search");
    if(!v.firstChild){
      v.innerHTML=`<button type="button" class="fab" id="fab" aria-expanded="false" aria-controls="dock" aria-label="検索・絞り込みを開く">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></svg><span class="fdot" hidden></span></button>
        <div class="sticky dock" id="dock" role="dialog" aria-label="検索・絞り込み" hidden>
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></svg>
          <input id="q" type="search" placeholder="チーム名で探す（例：バイエルン）" autocomplete="off" aria-label="チーム名で探す">

      const q=v.querySelector("#q");
      q.addEventListener("input",()=>{ S.q=q.value; renderSearchBody(); });
      v.querySelector("#qclear").onclick=()=>{ S.q=""; q.value=""; renderSearchBody(); q.focus(); };
      // アイコンで開閉。パネルの外をタップするか Esc で閉じる
      const fab=v.querySelector("#fab"), dock=v.querySelector("#dock");
      // 開いている間に条件を変えたら、閉じたときに一番早い試合の位置へ合わせ直す
      let snap="";
      const setOpen=on=>{ if(on===!dock.hidden) return;
        if(on) snap=S.q+"|"+S.sel.join(); else if(snap!==S.q+"|"+S.sel.join()) requestAnimationFrame(()=>toToday(true));
        dock.hidden=!on; fab.setAttribute("aria-expanded",String(on)); fab.setAttribute("aria-label", on?"検索・絞り込みを閉じる":"検索・絞り込みを開く"); };
      fab.onclick=()=>setOpen(dock.hidden);
      document.addEventListener("pointerdown",e=>{ if(!dock.hidden && !dock.contains(e.target) && !fab.contains(e.target)) setOpen(false); });

  const inSel = m => !S.sel.length || S.sel.includes(m.c);
  function renderSearchBody(){

      b.onclick=()=>{
        if(code==="ALL") S.sel=[];
        else { S.sel = S.sel.includes(code) ? S.sel.filter(c=>c!==code) : [...S.sel, code];
          if(S.sel.length===ORDER.length) S.sel=[]; }   // 全部選んだら「すべて」に戻す
        store.set("sel",S.sel); renderSearchBody(); }; f.appendChild(b); };
    mk("ALL","すべて"); ORDER.forEach(c=>mk(c,COMP[c]));

    days.appendChild(wallet(list));
    const hn=document.getElementById("shint"); if(hn) hn.textContent = S.dateMode==="carousel" ? "左右にスワイプすると日付が変わります（左が過去・右が今後）。カードを長押しするとマイウォレットに追加、もう一度長押しで解除。時刻はすべて日本時間です。" : "上へスワイプすると過去の結果、下へスワイプすると今後の試合です。カードの上の帯をタップすると引き出されます。カードを右にスワイプでマイウォレットに追加、左にスワイプで解除（マイウォレットのカードは金色の枠）。時刻はすべて日本時間です。";

  // 順位表のリーグ選択ボタン。見た目はマイページで「ICチップ」か「マット」を選べる
  // マッチ検索の大会ボタンも同じ部品。「すべて」はエンブレムの代わりに ALL の刻印
  function lgButton(b,c,label){
    label = label || COMP[c]; b.dataset.lg=c;
    const em = c==="ALL" ? `<span class="allmark">ALL</span>` : lgi(c);
    if(S.lgStyle==="matte"){ b.className="chip lgbtn matte"; b.innerHTML=em+`<span>${esc(label)}</span>`; }
    else { b.className="chip lgbtn"; b.innerHTML=`<span class="ic2" aria-hidden="true">${IC}${em}</span><span class="nm2">${esc(label)}</span>`; }
  }
  // ---- 順位表 ----
  const ZONE = {PL:[4,18],PD:[4,18],SA:[4,18],BL1:[4,16],FL1:[3,16],CL:[8,25]};
  function renderTable(){
    const v=document.getElementById("v-table"); v.innerHTML="";
    const head=document.createElement("div"); head.className="sticky";
    head.innerHTML=`<h2 class="sr-only">順位表</h2><nav class="filters lgbtn-row" aria-label="大会を選ぶ"></nav>`;
    const f=head.querySelector("nav");
    for(const c of ORDER){ const b=document.createElement("button"); b.type="button"; lgButton(b,c); b.setAttribute("aria-pressed",String(S.tbl===c));
      b.onclick=()=>{ S.tbl=c; store.set("tbl",c); renderTable(); }; f.appendChild(b); }
    v.appendChild(head);
    const [top,bottom]=ZONE[S.tbl], rows=STANDINGS[S.tbl]||[];
    const wrap=document.createElement("div"); wrap.className="tbl-wrap";
    wrap.innerHTML=`<table class="st"><thead><tr><th>#</th><th class="tm">チーム</th><th>試合</th><th>勝</th><th>分</th><th>敗</th><th>得失</th><th>勝点</th></tr></thead><tbody></tbody></table>`;
    const tb=wrap.querySelector("tbody");
    for(const [rk,id,n,pl,w,d,l,gd,pts] of rows){
      const [a,b]=colorsOf(id), tr=document.createElement("tr"); tr.className="trow"; tr.tabIndex=0;
      const z = rk<=top ? " z1" : rk>bottom ? " z3" : "";
      tr.innerHTML=`<td class="rk${z}">${rk}</td><td class="tm"><span class="tname">${crest(id,n)}<em>${esc(n)}</em></span></td>
        <td class="num">${pl}</td><td class="num">${w}</td><td class="num">${d}</td><td class="num">${l}</td><td class="num">${gd>0?"+"+gd:gd}</td><td class="pts">${pts}</td>`;
      const go=()=>{ S.q=n; S.sel=[]; store.set("sel",[]); location.hash="search"; };
      tr.onclick=go; tr.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
      tb.appendChild(tr);
    }
    v.appendChild(wrap);
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML = S.tbl==="CL"
      ? `<span><i style="background:var(--accent)"></i>1〜8位：ベスト16へ直接</span><span><i style="background:var(--bl1)"></i>25位以下：敗退</span><span>行をタップするとその試合を検索</span>`
      : `<span><i style="background:var(--accent)"></i>CL出場圏</span><span><i style="background:var(--bl1)"></i>降格圏</span><span>行をタップするとその試合を検索</span>`;
    v.appendChild(lg);
  }

  // ---- 設定 ----
  let armReset=false;
  function renderSettings(){
    const v=document.getElementById("v-settings"); v.innerHTML="";
    v.innerHTML=`<h2 class="sr-only">マイページ</h2>
      <div class="set-group"><h3>表示</h3>
        <div class="set-row"><div class="lbl"><b>テーマ</b><span>画面の明るさ</span></div>
          <div class="seg" id="seg-theme"></div></div>
        <div class="set-row"><div class="lbl"><b>過去の結果を表示</b><span>終わった試合のカードを出す</span></div>
          <label class="switch"><input type="checkbox" id="sw-past" ${S.showPast?"checked":""} aria-label="過去の結果を表示"><span></span></label></div>
        <div class="set-row"><div class="lbl"><b>日付の移動</b><span>${S.dateMode==="carousel" ? "左右で日付、長押しでマイウォレット" : "上下で日付、左右スワイプでマイウォレット"}</span></div>
          <div class="seg" id="seg-date"></div></div>
        <div class="set-row"><div class="lbl"><b>順位表のリーグボタン</b><span>リーグを選ぶボタンの見た目</span></div>
          <div class="seg" id="seg-lg"></div></div>
        <div class="set-row lg-preview" id="lg-preview" aria-hidden="true"></div>
      </div>
      <div class="set-group"><h3>ヘッダーのマーク</h3>
        <div class="set-row logo-row"><div class="logo-grid" id="logo-grid" role="radiogroup" aria-label="マーク"></div></div>
        <div class="set-row"><div class="lbl"><b>配色</b><span>新しいマークの色（今のマークは白黒＋金のまま）</span></div>
          <div class="seg" id="seg-logo-color"></div></div>
      </div>
      <div class="set-group"><h3>マイウォレット</h3>
        <div class="set-row"><div class="lbl"><b>マイウォレットを空にする</b><span>マイウォレットの ${S.picks.size}試合をすべて外す</span></div>
          <button type="button" class="btn-danger" id="reset" ${S.picks.size?"":"disabled"}>空にする</button></div>
      </div>
      <p class="about">日程・結果・順位は ${ASOF.slice(5).replace("-","/")} 時点の内容です。マイウォレットと設定はこの端末のブラウザに保存され、ほかの端末とは共有されません。</p>`;
    const seg=v.querySelector("#seg-theme");
    for(const [k,l] of [["system","自動"],["light","ライト"],["dark","ダーク"]]){
      const b=document.createElement("button"); b.type="button"; b.textContent=l; b.setAttribute("aria-pressed",String(S.theme===k));
      b.onclick=()=>{ S.theme=k; store.set("theme",k); applyTheme(); renderSettings(); }; seg.appendChild(b); }
    const lgGrid=v.querySelector("#logo-grid");
    for(const [k,l] of LOGOS){
      const b=document.createElement("button"); b.type="button"; b.className="logo-opt"; b.setAttribute("role","radio"); b.setAttribute("aria-checked",String(S.logo===k));
      b.innerHTML=`<span class="pv">${k==="current" ? CURRENT_LOGO : logoMark(k,S.logoColor)}</span><span class="nm">${l}</span>`;
      b.onclick=()=>{ S.logo=k; store.set("logo",k); renderBrand(); renderSettings(); }; lgGrid.appendChild(b); }
    const slc=v.querySelector("#seg-logo-color");
    for(const [k,l] of [["mono","モノクロ"],["league","リーグ色"]]){
      const b=document.createElement("button"); b.type="button"; b.textContent=l; b.setAttribute("aria-pressed",String(S.logoColor===k));
      b.onclick=()=>{ S.logoColor=k; store.set("logoColor",k); renderBrand(); renderSettings(); }; slc.appendChild(b); }
    const sd=v.querySelector("#seg-date");
    for(const [k,l] of [["vertical","縦スクロール"],["carousel","カルーセル"]]){
      const b=document.createElement("button"); b.type="button"; b.textContent=l; b.setAttribute("aria-pressed",String(S.dateMode===k));
      b.onclick=()=>{ S.dateMode=k; store.set("dateMode",k); renderSettings(); }; sd.appendChild(b); }
    const sl=v.querySelector("#seg-lg");
    for(const [k,l] of [["chip","ICチップ"],["matte","マット"]]){
      const b=document.createElement("button"); b.type="button"; b.textContent=l; b.setAttribute("aria-pressed",String(S.lgStyle===k));
      b.onclick=()=>{ S.lgStyle=k; store.set("lgStyle",k); renderSettings(); }; sl.appendChild(b); }
    const pv=v.querySelector("#lg-preview");
    for(const c of ["PL","PD","SA"]){ const b=document.createElement("span"); lgButton(b,c); b.setAttribute("aria-pressed",String(c==="PL")); pv.appendChild(b); }
    v.querySelector("#sw-past").onchange=e=>{ S.showPast=e.target.checked; store.set("showPast",S.showPast); };
    const r=v.querySelector("#reset");
    if(armReset){ r.classList.add("arm"); r.textContent="もう一度押すと空にします"; }
    r.onclick=()=>{ if(!armReset){ armReset=true; renderSettings(); setTimeout(()=>{ if(armReset){ armReset=false; if(S.tab==="settings") renderSettings(); } },4000); return; }
      armReset=false; S.picks.clear(); store.set("picks",[]); renderTabbar(); renderSettings(); };
  }

  // ---- 今日へ戻る（試合検索のみ） ----
  const btn=document.getElementById("todayBtn"), arrow=document.getElementById("tbArrow");
  function anchor(){ if(S.tab!=="search") return null; const hs=[...document.querySelectorAll("#days h2.day")]; // 「今日」は、まだ始まっていない次の試合がある日（今朝すでに終わった試合だけの日は飛ばす）
    const next=MATCHES.filter(m=>!isPast(m) && inSel(m)).sort((a,b)=>a.ts<b.ts?-1:1)[0];
    const nk=next? jst(next.ts).key : today();
    return hs.filter(h=>h.dataset.key>=nk).pop() || hs[0] || null; }
  // 日付の基準＝その日で一番早い試合のカード（束の一番手前＝下端）と、その下の日付
  const baseCard = h => { const s=h && h.previousElementSibling; return s && s.classList.contains("stack") && s.lastElementChild ? s.lastElementChild : h; };
  // 画面の下に浮かぶメニュー・検索パネル・ボタンを除いた、見える範囲の下端
  function viewBottom(){ const cs=getComputedStyle(document.documentElement), px=v=>parseFloat(cs.getPropertyValue(v))||0;
    return innerHeight - px("--nav-h") - px("--dock-h") - px("--dots-h") - 64; }
  // 一番早い試合のカードの下の日付が、見える範囲の下端に来るように縦位置を合わせる（遅い試合はその上に重なって見える）
  function alignBase(h, smooth){ if(!h) return; setDock();   // 下のパネルの高さを測ってから合わせる
    const top=h.getBoundingClientRect().bottom + scrollY - viewBottom();
    scrollTo({top:Math.max(0,top), behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth":"auto"}); }
  function curCar(){ return S.tab==="search" ? document.querySelector("#v-search .carousel") : null; }
  function todayIndex(car){ const keys=[...car.children].map(p=>p.dataset.key);
    const nk=nextKey(MATCHES.filter(inSel)); let i=keys.findIndex(k=>k>=nk); return i<0? keys.length-1 : i; }
  function toToday(smooth){ const car=curCar(); if(car){ goPage(car,todayIndex(car),smooth); return; }
    alignBase(anchor(), smooth); }
  // いま見ている日：日付（カードの束の下）が基準線（見える範囲の下端）より下にある最初の日＝基準線をまたいでいる日
  const pill=document.getElementById("datePill");
  function curDayHead(){
    const root = S.tab==="search" ? document.getElementById("days") : S.tab==="plan" ? document.getElementById("v-plan") : null;
    if(!root || root.closest("[hidden]")) return null;
    const car=root.querySelector(".carousel");
    if(car){ const pg=car.children[curPage(car)]; return pg ? pg.querySelector(":scope > h2.day") : null; }
    const hs=[...root.querySelectorAll("h2.day")]; if(!hs.length) return null;
    const line=viewBottom(); return hs.find(h=>h.getBoundingClientRect().bottom >= line-2) || hs[hs.length-1];
  }
  let pillKey=null;
  function renderPill(){
    const h=curDayHead(); if(!h){ pill.hidden=true; pillKey=null; return; }
    pill.hidden=false; const k=h.dataset.key; if(k===pillKey) return; pillKey=k;
    const d=new Date(k+"T00:00:00Z"), r=rel(k), past=k<today();
    pill.className="datepill"+(past?" past":"");
    pill.innerHTML=`${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）${r?`<span class="rel">${r}</span>`:""}`;
  }
  function onScroll(){ const car=curCar(); renderPill();
    if(car){ if(!car.children.length){ btn.hidden=true; return; } const c=curPage(car), ti=todayIndex(car); btn.hidden = c===ti;
      arrow.setAttribute("d", ti>c ? "M6 4l4 4-4 4" : "M10 4l-4 4 4 4"); return; }
    const a=anchor(); if(!a){ btn.hidden=true; return; }
    const y=baseCard(a).getBoundingClientRect().top, hb=a.getBoundingClientRect().bottom;
    btn.hidden = y>-40 && hb<viewBottom()+80;
    arrow.setAttribute("d", y<0 ? "M4 10l4-4 4 4" : "M4 6l4 4 4-4"); }
  btn.onclick=()=>toToday(true);
  // 下のパネルの高さを測って、ボタンや一覧の余白に使う
  const setDock=()=>{ const d=document.getElementById("dock"); const h=(d && !d.hidden && !document.getElementById("v-search").hidden) ? d.offsetHeight+76 : 0; document.documentElement.style.setProperty("--dock-h", h+"px");
    const dv=[...document.querySelectorAll(".cdots")].some(x=>x.getClientRects().length); document.documentElement.style.setProperty("--dots-h", dv? "30px":"0px"); };
  addEventListener("resize", setDock); new MutationObserver(()=>requestAnimationFrame(setDock)).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["hidden"]}); setDock();
  addEventListener("scroll", onScroll, {passive:true});

  // ---- 画面の切り替え（#plan / #search / #table / #settings） ----
  const VIEWS={plan:renderPlan, search:renderSearch, table:renderTable, settings:renderSettings};
  function route(){
    const h=location.hash.slice(1); S.tab = VIEWS[h] ? h : "search"; S.openId=null; armReset=false;
    for(const k in VIEWS) document.getElementById("v-"+k).hidden = k!==S.tab;
    renderTabbar(); VIEWS[S.tab]();
    if(S.tab!=="search"){ scrollTo({top:0}); btn.hidden=true; }
    requestAnimationFrame(renderPill);
  }
  addEventListener("hashchange", route);
  route();

  // ---- 毎朝の更新データを読む（GitHub Actions が data/app.json を更新する）----
  // 読めないとき（電波がない等）は、サービスワーカーが保存した前回のデータ、それもなければページに書き込んである時点のデータで表示する
  (async()=>{
    const load=async()=>{
      let d=null; try{ const r=await fetch("data/app.json",{cache:"no-cache"}); if(r.ok) d=await r.json(); }catch(e){}
      if(!d) return;
      const fx=d.fixtures||{}, st=d.standings||{}, syncAt=d.meta && d.meta.last_sync_at;
      const jaT=x=>({id:x.id, n:(x.id!=null && JA[x.id]) || x.n});
      const now=Date.now(), from=now-8*864e5, to=now+400*864e5, out=[];
      for(const code of Object.keys(fx)) for(const it of (fx[code].items||[])){
        const t=Date.parse(it.ts); if(!(t>=from && t<=to)) continue;
        const o={id:it.id, c:code, ts:it.ts, md:it.md, h:jaT(it.h), a:jaT(it.a), st:it.st};
        if(it.sc && it.sc[0]!=null && it.sc[1]!=null) o.sc=it.sc;
        out.push(o); }
      let changed=false;
      if(out.length){ MATCHES=out.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:(a.c<b.c?-1:1)); changed=true; }
      for(const code of Object.keys(st)){ const tb=(st[code].tables||[])[0]; if(!tb) continue;
        STANDINGS[code]=tb.rows.map(r=>[r.rank, r.team.id, (JA[r.team.id]||r.team.n), r.played, r.w, r.d, r.l, r.gd, r.pts]); changed=true; }
      if(syncAt){ ASOF=new Date(Date.parse(syncAt)+9*3600e3).toISOString().slice(0,10); }
      if(changed){ const keep=S.openId; renderTabbar(); VIEWS[S.tab](); S.openId=keep; }
    };
    await load();
    // アプリに戻ってきたとき、前回の読み込みから30分以上たっていれば読み直す
    let last=Date.now();
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-last>30*60e3){ last=Date.now(); load(); } });
  })();
})();
</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
